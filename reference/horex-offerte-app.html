<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     HOR-EX MERKTOKENS
     ============================================================ */
  :root{
    --geel:#FEC129; --geel-zacht:#FFF3D2;
    --ink:#1E1E1E; --canvas:#FFFAED; --paper:#FFFFFF;
    --line:#EDE4CE; --muted:#857E6C;
    --display:'Playfair Display', Georgia, serif;
    --body:'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --r:14px;
    --shadow:0 1px 2px rgba(30,30,30,.04), 0 10px 28px rgba(30,30,30,.07);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--body);font-size:17px;background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased}
  #app{min-height:100vh;display:flex;flex-direction:column}

  header{position:sticky;top:0;z-index:20;background:var(--ink)}
  .head-inner{max-width:820px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:16px}
  .logo{height:26px;width:auto;display:block}
  .head-step{margin-left:auto;font-size:12.5px;color:rgba(255,250,237,.6);font-variant-numeric:tabular-nums}
  .bar{height:3px;background:rgba(255,250,237,.14)}
  .bar i{display:block;height:100%;background:var(--geel);width:0;transition:width .5s cubic-bezier(.4,0,.2,1)}

  main{flex:1;display:flex;justify-content:center;padding:0 22px}
  .stage{width:100%;max-width:820px;padding:46px 0 120px}
  .screen{animation:in .42s cubic-bezier(.16,1,.3,1) both}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none}*{transition:none!important}}

  .eyebrow{display:flex;align-items:center;gap:9px;margin-bottom:13px;
    font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;color:var(--muted)}
  .eyebrow::before{content:'';width:19px;height:11px;flex:none;
    background:repeating-linear-gradient(90deg,var(--geel) 0 3px,transparent 3px 6px)}

  h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.08;letter-spacing:-.015em}
  @media(max-width:560px){h1{font-size:31px}}
  .sub{color:var(--muted);font-size:16px;line-height:1.55;margin-top:12px;max-width:48ch}

  /* ---------- productkaarten ---------- */
  .products{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:28px}
  @media(max-width:700px){.products{grid-template-columns:1fr 1fr}}
  @media(max-width:380px){.products{grid-template-columns:1fr}}

  .pcard{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);
    padding:0;overflow:hidden;cursor:pointer;font:inherit;color:inherit;text-align:left;
    display:flex;flex-direction:column;
    transition:border-color .18s,transform .18s,box-shadow .18s}
  .pcard:hover{border-color:var(--geel);transform:translateY(-2px);box-shadow:var(--shadow)}
  .pcard:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .pcard.on{border-color:var(--geel);box-shadow:0 0 0 3px var(--geel-zacht)}

  .pshot{display:block;position:relative;width:100%;aspect-ratio:4/3;background:#F3EEE2;overflow:hidden}
  .pshot svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* de foto ligt bovenop de illustratie; laadt hij niet, dan blijft de tekening staan */
  .pshot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .5s cubic-bezier(.16,1,.3,1)}
  .pcard:hover .pshot img{transform:scale(1.04)}
  .tick{position:absolute;top:8px;right:8px;z-index:2;width:22px;height:22px;border-radius:50%;
    background:var(--geel);color:var(--ink);display:none;place-items:center;font-size:12px;font-weight:700}
  .pcard.on .tick{display:grid}

  .pmeta{display:block;padding:11px 12px 13px}
  .pmeta .t{display:block;font-weight:600;font-size:14.5px;line-height:1.25;letter-spacing:-.01em}
  .pmeta .d{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}

  /* ---------- keuzekaarten ---------- */
  .grid{display:grid;gap:10px;margin-top:28px}
  .card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);
    padding:18px 19px;text-align:left;cursor:pointer;font:inherit;color:inherit;
    display:flex;align-items:center;gap:15px;
    transition:border-color .16s,transform .16s,box-shadow .16s,background .16s}
  .card:hover{border-color:var(--geel);transform:translateY(-1px);box-shadow:var(--shadow)}
  .card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .card.on{border-color:var(--geel);background:var(--geel-zacht)}
  .card .t{display:block;font-weight:600;font-size:16px;letter-spacing:-.01em}
  .card .d{display:block;font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.45}
  .card .body{flex:1}
  .key{flex:none;width:27px;height:27px;border-radius:8px;border:1.5px solid var(--line);
    display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--paper)}
  .card.on .key{background:var(--geel);border-color:var(--geel);color:var(--ink)}

  /* ---------- kleurstalen ---------- */
  .swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}
  @media(max-width:480px){.swatches{grid-template-columns:repeat(2,1fr)}}
  .sw{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);
    padding:12px;cursor:pointer;font:inherit;color:inherit;text-align:center;
    transition:border-color .16s,transform .16s,background .16s}
  .sw:hover{border-color:var(--geel);transform:translateY(-1px)}
  .sw.on{border-color:var(--geel);background:var(--geel-zacht)}
  .sw i{display:block;height:54px;border-radius:9px;border:1px solid rgba(0,0,0,.12);margin-bottom:10px}
  .sw .t{font-size:13.5px;font-weight:500}

  /* ---------- maat ---------- */
  .measure{display:grid;grid-template-columns:1fr 250px;gap:30px;margin-top:28px;align-items:start}
  @media(max-width:680px){.measure{grid-template-columns:1fr}}
  label{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px}
  input[type=text],input[type=email],input[type=tel],textarea,input.mm{
    width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:11px;
    padding:13px 14px;font:inherit;font-size:16px;color:var(--ink);font-family:var(--body);
    transition:border-color .16s,box-shadow .16s}
  input:focus,textarea:focus{outline:none;border-color:var(--geel);box-shadow:0 0 0 3px var(--geel-zacht)}
  input.mm{font-variant-numeric:tabular-nums}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.45}
  .field{margin-bottom:19px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .unit{position:relative}
  .unit b{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);font-weight:500;pointer-events:none}

  .preview{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:sticky;top:96px}
  .preview h4{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:18px;font-weight:600}
  .stageframe{height:205px;display:grid;place-items:center}
  .frame{position:relative;border-style:solid;transition:width .2s,height .2s,border-color .2s}
  .vulling{position:absolute;inset:0}
  .dim{position:absolute;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .dim.w{bottom:-21px;left:50%;transform:translateX(-50%)}
  .dim.h{right:-9px;top:50%;transform:translate(100%,-50%)}
  /* ---------- meethulp ---------- */
  .meethulp{width:100%;display:flex;align-items:center;gap:13px;text-align:left;
    background:var(--paper);border:1.5px solid var(--line);border-radius:11px;
    padding:11px 13px;margin-bottom:19px;cursor:pointer;font:inherit;color:inherit;
    transition:border-color .16s,box-shadow .16s,transform .16s}
  .meethulp:hover{border-color:var(--geel);box-shadow:var(--shadow);transform:translateY(-1px)}
  .meethulp:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .meethulp .mini{flex:none;width:56px;height:44px;border-radius:8px;overflow:hidden;background:#F3EEE2}
  .meethulp .mini svg{width:100%;height:100%;display:block}
  .meethulp .mt{flex:1}
  .meethulp .mt b{display:block;font-size:14.5px;font-weight:600}
  .meethulp .mt span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
  .meethulp .pijl{flex:none;width:26px;height:26px;border-radius:50%;background:var(--geel);
    color:var(--ink);display:grid;place-items:center;font-size:13px;font-weight:700}

  /* ---------- popup ---------- */
  .modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;
    background:rgba(30,30,30,.55);animation:fade .2s ease both}
  /* zonder deze regel wint display:grid van het hidden-attribuut
     en blijft de overlay altijd zichtbaar */
  .modal[hidden]{display:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal-paneel{background:var(--canvas);border-radius:18px;max-width:560px;width:100%;
    max-height:92vh;overflow:auto;padding:26px;position:relative;
    animation:omhoog .34s cubic-bezier(.16,1,.3,1) both}
  @keyframes omhoog{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
  .modal-sluit{position:absolute;top:15px;right:15px;width:34px;height:34px;border-radius:50%;
    border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font:inherit;font-size:16px;
    color:var(--ink);display:grid;place-items:center}
  .modal-sluit:hover{border-color:var(--ink)}
  .modal h3{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.15;padding-right:40px}
  .tekening{background:var(--paper);border:1px solid var(--line);border-radius:13px;
    margin-top:18px;padding:14px}
  .tekening svg{width:100%;height:auto;display:block}
  .modal video{width:100%;border-radius:13px;margin-top:18px;display:block;background:#000}
  .regels{margin-top:20px;display:grid;gap:12px}
  .regel{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.5}
  .regel b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--geel);color:var(--ink);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px}
  .modal .slot{margin-top:20px;font-size:13px;color:var(--muted);line-height:1.5;
    border-top:1px solid var(--line);padding-top:14px}

  .warn{margin-top:15px;font-size:13px;background:var(--geel-zacht);border-left:3px solid var(--geel);
    padding:11px 13px;border-radius:0 9px 9px 0;line-height:1.5}

  .actions{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
  button.btn{font-family:var(--body);font-size:15.5px;font-weight:600;border-radius:11px;padding:14px 24px;
    cursor:pointer;border:1.5px solid transparent;transition:opacity .16s,transform .16s,background .16s}
  .btn.primary{background:var(--geel);color:var(--ink)}
  .btn.primary:hover{background:#F5B417}
  .btn.primary:disabled{opacity:.4;cursor:not-allowed;background:var(--geel)}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--ink)}
  .btn:active{transform:scale(.985)}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .back{background:none;border:none;font:inherit;font-size:13.5px;color:var(--muted);
    cursor:pointer;padding:6px 0;margin-bottom:22px;display:inline-flex;align-items:center;gap:6px}
  .back:hover{color:var(--ink)}

  .item{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 16px;display:flex;gap:14px;align-items:center;margin-bottom:10px}
  .thumb{flex:none;width:62px;height:47px;border-radius:9px;overflow:hidden;position:relative;
    background:#F3EEE2;border:1px solid var(--line)}
  .thumb svg{position:absolute;inset:0;width:100%;height:100%}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .item .body{flex:1;min-width:0}
  .item .t{display:block;font-weight:600;font-size:15.5px}
  .item .d{display:block;font-size:13px;color:var(--muted);margin-top:3px}
  .item .m{font-variant-numeric:tabular-nums;font-weight:600;font-size:14.5px;white-space:nowrap}
  .del{background:none;border:none;color:var(--muted);cursor:pointer;font:inherit;font-size:13px;padding:4px;text-decoration:underline}
  .del:hover{color:#A8412F}

  .note{background:var(--geel-zacht);border-radius:var(--r);padding:16px 18px;font-size:14px;line-height:1.55;margin-top:20px}
  .done{text-align:center;padding:62px 0}
  .done .mark{width:60px;height:60px;border-radius:50%;background:var(--geel);color:var(--ink);
    display:grid;place-items:center;margin:0 auto 24px;font-size:27px;font-weight:700}
  .done .sub{margin-left:auto;margin-right:auto}
</style>

function openMeethulp(){
  const h = MEETHULP[meetSoort(prodVan(d.product))];

  m.innerHTML = `<div class="modal-paneel" role="dialog" aria-modal="true" aria-label="${h.titel}">
    <button class="modal-sluit" data-sluit aria-label="Sluiten">✕</button>

    ${h.video
      ? `<video src="${h.video}" controls playsinline preload="metadata"></video>`
      : `<div class="tekening">${h.tekening}</div>`}
    <div class="regels">
      ${h.regels.map((r,i)=>`<div class="regel"><b>${i+1}</b><span>${r}</span></div>`).join('')}
    </div>
    <div class="slot">Komt u er niet uit? Vul een schatting in — wij meten alles zelf na op locatie voordat er iets geproduceerd wordt.</div>
  </div>`;
  m.hidden = false;
  document.body.style.overflow = 'hidden';
  m.querySelector('[data-sluit]').focus();
}
function sluitMeethulp(){
  el('modal').hidden = true;
  el('modal').innerHTML = '';
  document.body.style.overflow = '';

    img:'https://d8j0ntlcm91z4.cloudfront.net/user_3134LCyzspLWeLzqfBQFTH9bKOs/hf_20260820_111535_dba6a8a3-1f50-4917-942a-12dd8db1b1fc.png', palet:'stof', kleurLabel:'Welke stofkleur?', vulling:'wave', gaasStap:false, uitvoeringen:null },
  { id:'veranda-zonwering', naam:'Veranda zonwering', kort:'Schermdoek tegen zon en inkijk',
    img:'https://d8j0ntlcm91z4.cloudfront.net/user_3134LCyzspLWeLzqfBQFTH9bKOs/hf_20260820_111535_6ecc21ca-5f3e-4ea6-831f-98759098cd5b.png', palet:'doek', kleurLabel:'Welke doekkleur?', vulling:'doek', gaasStap:false, uitvoeringen:null }
];

const MIN_MM = 300, MAX_MM = 6000;

/* ---------- state ---------- */
let items = [];
let d = null;
let laatste = {};
let scherm = 'intro';
let klant = {naam:'',email:'',tel:'',adres:'',opmerking:''};

const nieuw = () => ({product:null,uitvoering:null,kleur:null,gaas:laatste.gaas||null,ruimte:'',breedte:'',hoogte:''});

/* ---------- helpers ---------- */
const el  = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const prodVan  = id => PRODUCTEN.find(p=>p.id===id);
const paletVan = p => PALETTEN[p.palet];
const kleurVan = (p,id) => paletVan(p).find(k=>k.id===id);

function stappenVoor(){
  const p = d && d.product ? prodVan(d.product) : null;
  if(!p) return ['product'];
  const st = ['product'];
  if(p.uitvoeringen) st.push('uitvoering');
  st.push('kleur');
  if(p.gaasStap) st.push('gaas');
  st.push('maat');
  return st;
}
/* waar de terugknop van dit scherm heen moet */
const vorige = s => { const st = stappenVoor(); return st[st.indexOf(s)-1] || 'product'; };

function vullingCss(p, kleurHex){
  if(!p) return '';
  if(p.vulling==='gaas'){
    const dicht = d.gaas==='pollen' ? 2 : 3;
    return 'background-color:rgba(255,255,255,.4);background-image:'
      + `repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 .5px,transparent .5px ${dicht}px),`
      + `repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 .5px,transparent .5px ${dicht}px);`;
  }
  if(p.vulling==='plisse') return `background-color:${kleurHex};background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 8px);`;
  if(p.vulling==='wave')   return `background-color:${kleurHex};background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 2px,rgba(255,255,255,.22) 8px,transparent 18px 26px);`;
  return `background-color:${kleurHex};background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 2px,transparent 2px 5px);`;
}

function ga(naar){ scherm = naar; render(); window.scrollTo({top:0,behavior:'smooth'}); }

/* auto-advance: keuze aantikken schuift vanzelf door */
function kies(veld, waarde, volgende){
  d[veld] = waarde;
  render();
  setTimeout(()=>{ if(volgende) ga(volgende); }, 230);
}

/* ---------- render ---------- */
function render(){
  const st = stappenVoor();
  const idx = st.indexOf(scherm);
  const inFlow = idx > -1;
  el('headStep').textContent = inFlow
    ? (st.length>1 ? `Stap ${idx+1} van ${st.length}` : 'Stap 1')
    : (items.length ? `${items.length} ${items.length===1?'product':'producten'} toegevoegd` : '');
  el('bar').style.width = inFlow ? `${idx/Math.max(st.length,4)*100+12}%`
    : (scherm==='overzicht'?'88%':scherm==='gegevens'?'96%':scherm==='klaar'?'100%':'0%');
  el('stage').innerHTML = ({intro:vIntro,product:vProduct,uitvoering:vUitvoering,kleur:vKleur,
                            gaas:vGaas,maat:vMaat,overzicht:vOverzicht,gegevens:vGegevens,
                            klaar:vKlaar})[scherm]();
  bind();
  if(scherm==='maat') updatePreview();
}

const terug = naar => `<button class="back" data-ga="${naar}">← Terug</button>`;
const shot  = p => `<span class="pshot">${ILLUSTRATIE[p.id]||''}`
  + (p.img?`<img src="${p.img}" alt="${p.naam}" loading="lazy" onerror="this.remove()">`:'')
  + `<span class="tick">✓</span></span>`;

function vIntro(){ return `<div class="screen">
  <div class="eyebrow">Offerte aanvragen</div>
  <h1>Stel uw raamoplossing samen<br>en ontvang een prijsopgave</h1>
  <p class="sub">U kiest per raam of deur het product, de kleur en de afwerking, en vult de maten in. Meerdere producten voegt u achter elkaar toe. Duurt ongeveer twee minuten.</p>
  <div class="note">Twijfelt u over de maten? Vul een schatting in. Wij meten altijd zelf na op locatie voordat er iets geproduceerd wordt.</div>
  <div class="actions"><button class="btn primary" data-start>Beginnen</button></div>
</div>`; }

function vProduct(){
  return `<div class="screen">
  ${items.length ? terug('overzicht') : terug('intro')}
  <div class="eyebrow">Stap 1</div>
  <h1>Wat wilt u laten maken?</h1>
  <p class="sub">Nog niet zeker? Kies wat het dichtst bij uw situatie komt — we nemen het bij de inmeting samen door.</p>
  <div class="products">
    ${PRODUCTEN.map(x=>`
      <button class="pcard ${d.product===x.id?'on':''}" data-prod="${x.id}">
        ${shot(x)}
        <span class="pmeta"><span class="t">${x.naam}</span><span class="d">${x.kort}</span></span>
      </button>`).join('')}
  </div>
</div>`;
}

function vUitvoering(){
  const p = prodVan(d.product);
  return `<div class="screen">
  ${terug('product')}
  <div class="eyebrow">Stap 2</div>
  <h1>Welke uitvoering?</h1>
  <p class="sub">${p.naam} zijn er in meerdere varianten. Kies wat bij uw raam of deur past.</p>
  <div class="grid">
    ${p.uitvoeringen.map(u=>`
      <button class="card ${d.uitvoering===u.id?'on':''}" data-uitv="${u.id}">
        <span class="body"><span class="t">${u.naam}</span><span class="d">${u.omschrijving}</span></span>
      </button>`).join('')}
  </div>
</div>`;
}

function vKleur(){
  const p = prodVan(d.product);
  return `<div class="screen">
  ${terug(vorige('kleur'))}
  <div class="eyebrow">Stap ${stappenVoor().indexOf('kleur')+1}</div>
  <h1>${p.kleurLabel}</h1>
  <p class="sub">Kleuren wijken op een scherm altijd iets af. Bij de inmeting nemen we stalen mee zodat u ze in uw eigen licht kunt zien.</p>
  <div class="swatches">
    ${paletVan(p).map(k=>`
      <button class="sw ${d.kleur===k.id?'on':''}" data-kleur="${k.id}">
        <i style="background:${k.hex};${k.textuur?'background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.10) 0 2px,transparent 2px 4px)':''}"></i>
        <span class="t">${k.naam}</span>
      </button>`).join('')}
  </div>
</div>`; }

function vGaas(){ return `<div class="screen">
  ${terug(vorige('gaas'))}
  <div class="eyebrow">Stap ${stappenVoor().indexOf('gaas')+1}</div>
  <h1>Welk gaas?</h1>
  <div class="grid">
    ${GAAS.map(g=>{
      const dicht = g.id==='pollen'?2:3;
      const patroon = 'background-color:rgba(255,255,255,.4);background-image:'
        + `repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 .5px,transparent .5px ${dicht}px),`
        + `repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 .5px,transparent .5px ${dicht}px);`;
      return `<button class="card ${d.gaas===g.id?'on':''}" data-gaas="${g.id}">
        <span class="key" style="${patroon}"></span>
        <span class="body"><span class="t">${g.naam}</span><span class="d">${g.omschrijving}</span></span>
      </button>`;
    }).join('')}
  </div>
</div>`; }

function vMaat(){
  const p  = prodVan(d.product);
  const st = stappenVoor();
  const heeftRand = p.vulling==='gaas';
  return `<div class="screen">
  ${terug(vorige('maat'))}
  <div class="eyebrow">Stap ${st.length}</div>
  <h1>Wat zijn de maten?</h1>
  <p class="sub">${heeftRand
    ? 'Meet de binnenmaat van het kozijn, op drie plekken. Twijfelt u? Neem de kleinste maat.'
    : 'Meet de breedte van het raam of de rail, en de hoogte tot waar het doek moet vallen.'}</p>
  <div class="measure">
    <div>
      <div class="field">
        <label for="ruimte">Waar komt dit?</label>
        <input id="ruimte" type="text" value="${esc(d.ruimte)}" placeholder="Bijv. slaapkamer voorzijde" autocomplete="off">
        <div class="hint">Geef elk product een eigen naam. Zo weet u bij levering precies wat waar hoort.</div>
      </div>
      <button class="meethulp" data-meethulp>
        <span class="mini">${MEETHULP[meetSoort(p)].tekening}</span>
        <span class="mt"><b>Hoe meet ik dit op?</b><span>Voorbeeld met de juiste meetpunten</span></span>
        <span class="pijl">→</span>
      </button>
      <div class="row">
        <div class="field"><label for="breedte">Breedte</label>
          <div class="unit"><input class="mm" id="breedte" type="text" inputmode="numeric" value="${esc(d.breedte)}" placeholder="1200" autocomplete="off"><b>mm</b></div></div>
        <div class="field"><label for="hoogte">Hoogte</label>
          <div class="unit"><input class="mm" id="hoogte" type="text" inputmode="numeric" value="${esc(d.hoogte)}" placeholder="2100" autocomplete="off"><b>mm</b></div></div>
      </div>
      <div id="warnBox"></div>
      <div class="actions">
        <button class="btn primary" data-add disabled>Toevoegen aan aanvraag</button>
      </div>
    </div>
    <div class="preview">
      <h4>Voorbeeld op schaal</h4>
      <div class="stageframe">
        <div class="frame" id="frame" style="border-width:${heeftRand?7:0}px;box-shadow:0 2px 12px rgba(30,30,30,.13)">
          <div class="vulling" id="vulling"></div>
          <span class="dim w" id="dimW"></span>
          <span class="dim h" id="dimH"></span>
        </div>
      </div>
    </div>
  </div>
</div>`;
}

/* Alleen het voorbeeld bijwerken, NIET het hele scherm opnieuw opbouwen.
   Anders springt de cursor bij elke toetsaanslag terug naar het begin
   en typ je 2100 als 0012. */
function updatePreview(){
  const fr = el('frame'); if(!fr) return;
  const p = prodVan(d.product);
  const k = kleurVan(p, d.kleur) || {hex:'#383E42'};
  const b = parseInt(d.breedte,10)||0, h = parseInt(d.hoogte,10)||0;
  const s = (b&&h) ? Math.min(232/b, 172/h) : 0;

  fr.style.width  = (b&&h ? Math.max(42,b*s) : 152) + 'px';
  fr.style.height = (b&&h ? Math.max(42,h*s) : 112) + 'px';
  fr.style.borderColor = p.vulling==='gaas' ? k.hex : 'transparent';
  el('vulling').style.cssText = vullingCss(p, k.hex);
  el('dimW').textContent = b ? b + ' mm' : '';
  el('dimH').textContent = h ? h + ' mm' : '';

  const buiten = (b && (b<MIN_MM||b>MAX_MM)) || (h && (h<MIN_MM||h>MAX_MM));
  el('warnBox').innerHTML = buiten
    ? `<div class="warn">Deze maat valt buiten wat we standaard produceren (${MIN_MM}–${MAX_MM} mm). Vul hem gerust in — we nemen persoonlijk contact op over de mogelijkheden.</div>`
    : '';

  const btn = document.querySelector('[data-add]');
  if(btn) btn.disabled = !(d.ruimte.trim() && b>=MIN_MM && h>=MIN_MM);
}

function vOverzicht(){ return `<div class="screen">
  <div class="eyebrow">Uw aanvraag</div>
  <h1>${items.length} ${items.length===1?'product':'producten'} in uw aanvraag</h1>
  <div style="margin-top:28px">
    ${items.map((it,i)=>{
      const p = prodVan(it.product);
      const k = kleurVan(p, it.kleur);
      const u = p.uitvoeringen ? p.uitvoeringen.find(x=>x.id===it.uitvoering) : null;
      const g = p.gaasStap ? GAAS.find(x=>x.id===it.gaas) : null;
      const regel = [u?u.naam:p.naam, k?k.naam:''].concat(g?[g.naam]:[]).filter(Boolean).join(' · ');
      return `<div class="item">
        <span class="thumb">${ILLUSTRATIE[p.id]||''}${p.img?`<img src="${p.img}" alt="" onerror="this.remove()">`:''}</span>
        <span class="body"><span class="t">${esc(it.ruimte)}</span><span class="d">${regel}</span></span>
        <span class="m">${it.breedte} × ${it.hoogte} mm</span>
        <button class="del" data-del="${i}">verwijder</button>
      </div>`;
    }).join('')}
  </div>
  <div class="actions">
    <button class="btn ghost" data-nieuw>+ Nog iets toevoegen</button>
    <button class="btn primary" data-ga="gegevens">Verder</button>
  </div>
  <div class="note">Uw vorige keuzes staan alvast klaar bij het volgende product van hetzelfde type. Aanpassen kan altijd.</div>
</div>`; }

function vGegevens(){ return `<div class="screen">
  ${terug('overzicht')}
  <div class="eyebrow">Bijna klaar</div>
  <h1>Waar mogen we de prijsopgave naartoe sturen?</h1>
  <div style="margin-top:28px;max-width:470px">
    <div class="row">
      <div class="field"><label for="naam">Naam</label><input id="naam" type="text" value="${esc(klant.naam)}"></div>
      <div class="field"><label for="tel">Telefoon</label><input id="tel" type="tel" value="${esc(klant.tel)}"></div>
    </div>
    <div class="field"><label for="email">E-mailadres</label><input id="email" type="email" value="${esc(klant.email)}"></div>
    <div class="field"><label for="adres">Adres</label><input id="adres" type="text" value="${esc(klant.adres)}" placeholder="Straat, postcode, plaats">
      <div class="hint">Nodig om te bepalen of we bij u kunnen inmeten.</div></div>
    <div class="field"><label for="opmerking">Iets wat we moeten weten?</label><textarea id="opmerking" rows="3" placeholder="Optioneel">${esc(klant.opmerking)}</textarea></div>
  </div>
  <div class="actions"><button class="btn primary" data-verstuur>Aanvraag versturen</button></div>
</div>`; }

function vKlaar(){ return `<div class="screen done">
  <div class="mark">✓</div>
  <h1>Aanvraag verstuurd</h1>
  <p class="sub">We hebben uw ${items.length} ${items.length===1?'maat':'maten'} ontvangen en nemen binnen één werkdag contact op om een inmeetafspraak te plannen. Een kopie staat in uw mailbox.</p>
</div>`; }

/* ---------- interactie ---------- */
function bind(){
  const q = (s,f) => document.querySelectorAll(s).forEach(f);

  q('[data-ga]',    b => b.onclick = () => ga(b.dataset.ga));
  q('[data-start]', b => b.onclick = () => { d = nieuw(); ga('product'); });
  q('[data-nieuw]', b => b.onclick = () => { d = nieuw(); ga('product'); });

  q('[data-prod]', b => b.onclick = () => {
    const p = prodVan(b.dataset.prod);
    d.product = p.id; d.uitvoering = null;
    d.kleur = (laatste.palet===p.palet) ? laatste.kleur : null;
    render();
    setTimeout(()=>ga(p.uitvoeringen ? 'uitvoering' : 'kleur'), 230);
  });
  q('[data-uitv]', b => b.onclick = () => kies('uitvoering', b.dataset.uitv, 'kleur'));
  q('[data-kleur]',b => b.onclick = () => kies('kleur', b.dataset.kleur, prodVan(d.product).gaasStap?'gaas':'maat'));
  q('[data-gaas]', b => b.onclick = () => kies('gaas', b.dataset.gaas, 'maat'));

  /* maatvelden: alleen de state en het voorbeeld bijwerken, geen her-render */
  ['ruimte','breedte','hoogte'].forEach(id=>{
    const i = el(id); if(!i) return;
    i.oninput = () => {
      if(id!=='ruimte'){
        const schoon = i.value.replace(/\D/g,'').slice(0,5);
        if(schoon !== i.value){
          const eind = i.selectionStart - (i.value.length - schoon.length);
          i.value = schoon;
          i.setSelectionRange(eind, eind);
        }
      }
      d[id] = i.value;
      updatePreview();
    };
  });

  const mh = document.querySelector('[data-meethulp]');
  if(mh) mh.onclick = openMeethulp;

  const add = document.querySelector('[data-add]');
  if(add) add.onclick = () => {
    items.push({...d});
    laatste = {kleur:d.kleur, gaas:d.gaas, palet:prodVan(d.product).palet};
    ga('overzicht');
  };

  q('[data-del]', b => b.onclick = () => {
    items.splice(+b.dataset.del,1);
    if(!items.length){ d = nieuw(); ga('intro'); } else render();
  });

  ['naam','email','tel','adres','opmerking'].forEach(id=>{
    const i = el(id); if(i) i.oninput = () => klant[id] = i.value;
  });

  const v = document.querySelector('[data-verstuur]');
  if(v) v.onclick = () => {
    console.log('AANVRAAG →', {klant, items});   // hier komt de Supabase-insert + mail
    ga('klaar');
  };
}

/* popup sluiten: kruisje, klik ernaast of Escape */
el('modal').addEventListener('click', e=>{
  if(e.target.id==='modal' || e.target.closest('[data-sluit]')) sluitMeethulp();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && !el('modal').hidden) sluitMeethulp();
});

render();
</script>
